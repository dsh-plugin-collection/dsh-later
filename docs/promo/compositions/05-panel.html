<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../assets/base.css" />
    <style>
      html, body { background: transparent; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }

      .copy { position: absolute; left: 120px; top: 140px; width: 860px; }
      .headline { margin-top: 26px; font-size: 88px; }
      .sub { margin-top: 24px; font-size: 29px; }

      .bullets { margin-top: 40px; display: flex; flex-direction: column; gap: 24px; }
      .bullet { display: flex; gap: 16px; align-items: flex-start; font-size: 28px; line-height: 1.5; color: #a5a5b4; opacity: 0; }
      .bullet svg { flex: none; margin-top: 7px; color: var(--violet); }
      .bullet b { color: #f0f0f7; font-weight: 600; }

      .shot { position: absolute; left: 1040px; top: 196px; width: 660px; opacity: 0; }

      .ring-chips { left: 1063px; top: 281px; width: 613px; height: 198px; opacity: 0; }
      .ring-join { left: 1055px; top: 676px; width: 629px; height: 43px; border-radius: 10px; opacity: 0; }

      .tag { position: absolute; font-size: 25px; color: #ddd6fe; }
      .tag a { color: var(--violet); }
      .tag-chips { left: 700px; top: 274px; }
      .tag-join { left: 668px; top: 682px; }

      .conn { position: absolute; height: 1px; background: rgba(167, 139, 250, 0.45); opacity: 0; }
      .conn-chips { left: 828px; top: 292px; width: 232px; }
      .conn-join { left: 872px; top: 694px; width: 180px; }

      .prov { left: 120px; bottom: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s5" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="backdrop"></div>
      <div class="grid"></div>

      <div class="copy">
        <div class="kicker"><span class="bar"></span> PANEL</div>
        <h1 class="headline">点一下，<br />就是个<span class="accent">定时</span></h1>
        <p class="sub">输入框里那句话，就是提醒内容。</p>

        <div class="bullets">
          <div class="bullet">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5" /></svg>
            <span>快捷时段按<b>当前时间</b>现算，不是写死的档位</span>
          </div>
          <div class="bullet">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5" /></svg>
            <span>还能选日期时刻，或者自己填</span>
          </div>
          <div class="bullet">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5" /></svg>
            <span>没选时间时，加入按钮<b>不可点</b></span>
          </div>
        </div>
      </div>

      <div class="shot"><img class="realimg" src="../assets/real/panel2.png" alt="定时提醒面板" width="660" /></div>

      <div class="hlbox ring-chips" id="ring-chips"></div>
      <div class="conn conn-chips" id="conn-chips"></div>
      <div class="tag tag-chips" id="tag-chips">快捷时段</div>

      <div class="hlbox ring-join" id="ring-join"></div>
      <div class="conn conn-join" id="conn-join"></div>
      <div class="tag tag-join" id="tag-join">加入 · <a>HH:MM</a> 发送</div>

      <div class="prov">REAL GUI · 面板截图取自 0.2.1-rc.4</div>
    </div>

    <script src="../assets/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(".copy .kicker", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45 }, 0.05);
      tl.fromTo(".headline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 0.12);
      tl.fromTo(".sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5 }, 0.36);
      tl.fromTo(".bullet", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.12 }, 0.6);

      tl.fromTo(".shot", { opacity: 0, x: 40, scale: 0.98 }, { opacity: 1, x: 0, scale: 1, duration: 0.75, ease: "power3.out" }, 0.5);

      tl.to("#ring-chips", { opacity: 1, duration: 0.35 }, 1.3);
      tl.fromTo("#conn-chips", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "100% 50%", duration: 0.3 }, 1.35);
      tl.fromTo("#tag-chips", { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.4 }, 1.4);

      tl.to("#ring-chips", { opacity: 0.4, duration: 0.5 }, 2.5);
      tl.to("#ring-join", { opacity: 1, duration: 0.35 }, 2.6);
      tl.fromTo("#conn-join", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "100% 50%", duration: 0.3 }, 2.65);
      tl.fromTo("#tag-join", { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.4 }, 2.7);

      tl.fromTo(".prov", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
      tl.to(".shot", { y: -8, duration: 2 }, 3.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
