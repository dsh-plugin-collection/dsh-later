name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查（host + client）
        # 不用两条 `npx tsc`：Actions 的 `bash -e` 会让第一条一红就跳过第二条，
        # 与本地旧 `&&` 是同一个失明（issue #96）。脚本逐项目跑完再汇总退出码。
        run: node scripts/typecheck-all.mjs
      - name: 测试
        run: npm test
